plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.diffplug.spotless' version '8.10.4'
}

base {
	archivesName = project.name
}

repositories {
	mavenCentral()
	maven { url = "https://maven.wispforest.io/releases/" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// owo jar-in-jars its own libs
	implementation("io.wispforest:owo-lib:${project.owo_version}") { transitive = false }

	// owo injects endec into mc classes, owo ships it in game
	compileOnly "io.wispforest:endec:0.1.12"
	testRuntimeOnly "io.wispforest:endec:0.1.12"

	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

// build fails until spotlessApply
spotless {
	java {
		target 'src/*/java/**/*.java'
		removeUnusedImports()
		importOrder('java|javax', '', 'dev.skysurveyor', '\\#')
		trimTrailingWhitespace()
		endWithNewline()
		formatAnnotations()
	}
}
