name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # recordings arent in git, replay tests skip
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/*.jar

  # tag vX.Y.Z = release w/ that changelog entry, vX.Y.Z-beta.N = pre-release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # only job w/ write access
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: build/libs
      - name: Release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          awk -v v="$version" '$0 ~ "^## " v " " {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Surveyor ${{ steps.notes.outputs.version }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md
          # just the mod jar, not the sources one. fails if the tag doesnt match gradle.properties
          files: build/libs/skysurveyor-${{ steps.notes.outputs.version }}.jar
          fail_on_unmatched_files: true
